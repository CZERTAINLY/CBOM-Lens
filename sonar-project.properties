sonar.projectKey=ilm_cbom-lens
sonar.organization=ilm

sonar.go.coverage.reportPaths=coverage.unit.out,coverage.integration.out
sonar.go.golangci-lint.reportPaths=golangci-lint-report.xml

sonar.test.inclusions=**/*_test.go
# Generated mocks have no tests; platform-specific (windows) code cannot be tested on
# Linux CI; test-support packages (testing/, internal/dockertest) are executed only
# from other packages' tests, so `go test` reports them as entirely uncovered
sonar.coverage.exclusions=**/*_test.go,cmd/cbom-lens/main.go,cmd/cbom-lens/lens.go,testing/**,internal/dockertest/**,**/mock/**,**/registry/registry.go

# exclude specific file(s) from duplication detection
sonar.cpd.exclusions=internal/cdxprops/algorithm.go,internal/cdxprops/pem.go
