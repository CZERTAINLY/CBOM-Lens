# Mirrors the OmniTrustILM org-default Trivy policy (see
# OmniTrustILM/.github/.github/actions/resolve-trivy-config/trivy.yaml).
# The override in test_docker_image.yaml is enabled ONLY so the repo-local
# .trivyignore is honored for vulnerabilities without a fixable module
# release — the org gate neutralizes .trivyignore otherwise. Keep severity
# and scanner settings identical to the org default.
format: table
exit-code: 1
severity:
  - CRITICAL
  - HIGH

scan:
  scanners:
    - vuln
    - secret

vulnerability:
  type:
    - os
    - library
  ignore-unfixed: true
