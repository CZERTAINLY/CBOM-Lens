# These fixture directories deliberately contain crypto material and fake
# secrets: CBOM-lens is a crypto/secret scanner and its tests need real-shaped
# inputs (PEM private keys, JWTs, passwords) to exercise detection and BOM
# output. Kept narrow on purpose — testdata elsewhere stays scanned.
paths-ignore:
  - "internal/bom/testdata/**"
  - "internal/cdxprops/cdxtest/testdata/**"
