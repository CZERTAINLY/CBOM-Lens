name: Test Docker image

on:
  pull_request:
    paths-ignore:
      - 'deploy/charts/**'
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}-docker-test
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  test:
    uses: OmniTrustILM/.github/.github/workflows/containers-test.yml@main
    with:
      image: ilm/cbom-lens
      cache-scope: cbom-lens
      # Repo config mirrors the org policy; override exists only so the
      # repo-local .trivyignore (unfixable CVEs, see #184) is honored.
      allow-trivy-config-override: true
      build-args: |
        VERSION=${{ github.ref_name }}
